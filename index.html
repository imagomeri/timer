<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Timer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      margin: 0;
      padding: 24px;
      color: #222;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 28px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    .subtext {
      color: #666;
      margin-bottom: 24px;
      font-size: 15px;
    }
    .top-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .profile-btn {
      border: 2px solid #e7e7ea;
      background: #fafafa;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s ease;
    }
    .profile-btn:hover {
      border-color: #cfcfd6;
      background: #f5f5f7;
    }
    .profile-btn.active {
      border-color: #111;
      background: #111;
      color: white;
    }
    .profile-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .profile-meta {
      font-size: 13px;
      opacity: 0.8;
    }
    .summary-box {
      background: #fafafa;
      border-radius: 18px;
      padding: 18px;
      min-height: 100%;
    }
    .summary-item {
      margin-bottom: 14px;
    }
    .summary-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 26px;
      font-weight: bold;
      color: #111;
    }
    .active-user {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f1f1f3;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .time-display {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: 1px;
      margin: 10px 0 12px;
      color: #111;
      text-align: center;
    }
    .status {
      color: #666;
      font-size: 15px;
      min-height: 24px;
      margin-bottom: 22px;
      text-align: center;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      padding: 13px 22px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover { opacity: 0.95; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .start-btn {
      background: #111;
      color: white;
    }
    .stop-btn {
      background: #e9e9ec;
      color: #111;
    }
    .refresh-btn {
      background: #f4f4f5;
      color: #444;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .history-subtitle {
      font-size: 14px;
      color: #666;
    }
    .session-log {
      background: #fafafa;
      padding: 16px;
      border-radius: 16px;
      max-height: 460px;
      overflow-y: auto;
    }
    .empty-state {
      font-size: 14px;
      color: #888;
      padding: 8px 0;
    }
    .session-item {
      padding: 14px 0;
      border-bottom: 1px solid #ececec;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }
    .session-item:last-child {
      border-bottom: none;
    }
    .session-duration {
      display: inline-block;
      margin-top: 6px;
      font-weight: bold;
      color: #111;
    }
    .message {
      margin-top: 12px;
      font-size: 14px;
      color: #666;
      text-align: center;
      min-height: 20px;
    }
    @media (max-width: 820px) {
      .top-grid {
        grid-template-columns: 1fr;
      }
      .time-display {
        font-size: 48px;
      }
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Work Timer</h1>
      <div class="subtext">Shared timer for LaRua and Margo. Sessions are saved to Notion.</div>

      <div class="top-grid">
        <div>
          <div class="section-title">Choose profile</div>
          <div class="profile-grid">
            <button class="profile-btn active" data-profile="LaRua">
              <div class="profile-name">LaRua</div>
              <div class="profile-meta">Track LaRua's sessions</div>
            </button>
            <button class="profile-btn" data-profile="Margo">
              <div class="profile-name">Margo</div>
              <div class="profile-meta">Track Margo's sessions</div>
            </button>
          </div>
        </div>

        <div class="summary-box">
          <div class="section-title">This month</div>
          <div class="summary-item">
            <div class="summary-label">Selected profile</div>
            <div class="summary-value" id="selectedProfileLabel">LaRua</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Worked this month</div>
            <div class="summary-value" id="monthlyTotal">00:00:00</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Sessions this month</div>
            <div class="summary-value" id="monthlySessions">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="text-align:center;">
          <div class="active-user" id="activeUserBadge">Active profile: LaRua</div>
        </div>
        <div class="time-display" id="timer">00:00:00</div>
        <div class="status" id="status">Ready to start a session for LaRua.</div>
        <div class="buttons">
          <button class="start-btn" id="startBtn">Start</button>
          <button class="stop-btn" id="stopBtn" disabled>Stop</button>
          <button class="refresh-btn" id="refreshBtn">Refresh from Notion</button>
        </div>
        <div class="message" id="message"></div>
      </div>

      <div class="card">
        <div class="history-header">
          <div>
            <div class="section-title">Session history</div>
            <div class="history-subtitle" id="historySubtitle">Showing saved sessions for LaRua</div>
          </div>
        </div>
        <div class="session-log" id="logList"></div>
      </div>
    </div>
  </div>

  <script>
    // CHANGE THIS to your deployed backend URL
    const API_BASE = "https://YOUR-VERCEL-APP.vercel.app";

    const STORAGE_KEY = "sharedWorkTimerActiveState";
    const PROFILES = ["LaRua", "Margo"];

    let selectedProfile = "LaRua";
    let sessions = [];
    let timerInterval = null;

    const timerDisplay = document.getElementById("timer");
    const statusDisplay = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logList = document.getElementById("logList");
    const selectedProfileLabel = document.getElementById("selectedProfileLabel");
    const monthlyTotal = document.getElementById("monthlyTotal");
    const monthlySessions = document.getElementById("monthlySessions");
    const activeUserBadge = document.getElementById("activeUserBadge");
    const historySubtitle = document.getElementById("historySubtitle");
    const messageEl = document.getElementById("message");
    const profileButtons = document.querySelectorAll(".profile-btn");

    function getActiveState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { profile: null, start: null };
      try {
        return JSON.parse(raw);
      } catch {
        return { profile: null, start: null };
      }
    }

    function setActiveState(profile, start) {
      if (!profile || !start) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile, start }));
    }

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function formatDateTime(dateString) {
      return new Date(dateString).toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getMonthSessions(profileName) {
      const now = new Date();
      return sessions.filter((session) => {
        const d = new Date(session.start);
        return (
          session.profile === profileName &&
          d.getMonth() === now.getMonth() &&
          d.getFullYear() === now.getFullYear()
        );
      });
    }

    function getMonthTotalMs(profileName) {
      return getMonthSessions(profileName).reduce((sum, s) => sum + s.durationMs, 0);
    }

    function updateProfileButtons() {
      profileButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.profile === selectedProfile);
      });
    }

    function renderSummary() {
      selectedProfileLabel.textContent = selectedProfile;
      activeUserBadge.textContent = `Active profile: ${selectedProfile}`;
      historySubtitle.textContent = `Showing saved sessions for ${selectedProfile}`;
      monthlyTotal.textContent = formatDuration(getMonthTotalMs(selectedProfile));
      monthlySessions.textContent = String(getMonthSessions(selectedProfile).length);
    }

    function renderSessions() {
      const selectedSessions = sessions.filter(s => s.profile === selectedProfile);
      logList.innerHTML = "";

      if (!selectedSessions.length) {
        logList.innerHTML = `<div class="empty-state">No sessions saved yet for ${selectedProfile}.</div>`;
        return;
      }

      selectedSessions.forEach((session) => {
        const item = document.createElement("div");
        item.className = "session-item";
        item.innerHTML = `
          <div><strong>Profile:</strong> ${session.profile}</div>
          <div><strong>Start:</strong> ${formatDateTime(session.start)}</div>
          <div><strong>End:</strong> ${formatDateTime(session.end)}</div>
          <div class="session-duration">Time spent: ${formatDuration(session.durationMs)}</div>
        `;
        logList.appendChild(item);
      });
    }

    function updateTimerDisplay() {
      const active = getActiveState();

      if (!active.profile || !active.start || active.profile !== selectedProfile) {
        timerDisplay.textContent = "00:00:00";
        return;
      }

      const elapsed = Date.now() - new Date(active.start).getTime();
      timerDisplay.textContent = formatDuration(elapsed);
    }

    function updateControls() {
      const active = getActiveState();

      if (active.profile === selectedProfile && active.start) {
        statusDisplay.textContent = `Running for ${selectedProfile} since ${formatDateTime(active.start)}`;
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } else if (active.profile && active.profile !== selectedProfile) {
        statusDisplay.textContent = `${active.profile} currently has an active session on this device.`;
        startBtn.disabled = true;
        stopBtn.disabled = true;
      } else {
        statusDisplay.textContent = `Ready to start a session for ${selectedProfile}.`;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    function refreshUI() {
      updateProfileButtons();
      renderSummary();
      renderSessions();
      updateTimerDisplay();
      updateControls();
    }

    function setMessage(text) {
      messageEl.textContent = text || "";
    }

    async function fetchSessionsFromNotion() {
      const res = await fetch(`${API_BASE}/api/sessions`);
      if (!res.ok) {
        throw new Error("Could not load sessions from Notion");
      }
      const data = await res.json();
      sessions = data.sessions || [];
      refreshUI();
    }

    function selectProfile(profileName) {
      selectedProfile = profileName;
      refreshUI();
    }

    function startSession() {
      const active = getActiveState();
      if (active.profile && active.profile !== selectedProfile) {
        alert(`${active.profile} already has a running session on this device.`);
        return;
      }
      setActiveState(selectedProfile, new Date().toISOString());
      refreshUI();
    }

    async function stopSession() {
      const active = getActiveState();
      if (active.profile !== selectedProfile || !active.start) return;

      const payload = {
        profile: selectedProfile,
        start: active.start,
        end: new Date().toISOString()
      };

      setMessage("Saving to Notion...");

      try {
        const res = await fetch(`${API_BASE}/api/save-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Failed to save session");
        }

        setActiveState(null, null);
        await fetchSessionsFromNotion();
        setMessage("Saved to Notion.");
      } catch (err) {
        setMessage(err.message || "Failed to save session.");
      } finally {
        refreshUI();
      }
    }

    profileButtons.forEach((btn) => {
      btn.addEventListener("click", () => selectProfile(btn.dataset.profile));
    });

    startBtn.addEventListener("click", startSession);
    stopBtn.addEventListener("click", stopSession);
    refreshBtn.addEventListener("click", async () => {
      setMessage("Refreshing...");
      try {
        await fetchSessionsFromNotion();
        setMessage("Loaded latest sessions from Notion.");
      } catch (err) {
        setMessage(err.message || "Refresh failed.");
      }
    });

    timerInterval = setInterval(() => {
      updateTimerDisplay();
      updateControls();
    }, 1000);

    fetchSessionsFromNotion().catch(() => {
      refreshUI();
      setMessage("Could not load sessions yet. Check your backend URL.");
    });
  </script>
</body>
</html>
