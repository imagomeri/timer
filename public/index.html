<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Timer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: transparent;
      color: #222;
      margin: 0;
      padding: 12px;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.1;
    }

    .subtext {
      color: #666;
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.4;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #444;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .profile-btn {
      border: 1.5px solid #e7e7ea;
      background: #fafafa;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s ease;
    }

    .profile-btn:hover {
      border-color: #cfcfd6;
      background: #f5f5f7;
    }

    .profile-btn.active {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    .profile-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
      line-height: 1.1;
    }

    .profile-meta {
      font-size: 11px;
      opacity: 0.8;
      line-height: 1.3;
    }

    .summary-box {
      background: #fafafa;
      border-radius: 14px;
      padding: 12px;
      height: 100%;
    }

    .summary-item {
      margin-bottom: 8px;
    }

    .summary-item:last-child {
      margin-bottom: 0;
    }

    .summary-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      word-break: break-word;
      line-height: 1.2;
    }

    .timer-card {
      text-align: center;
    }

    .active-user {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f1f3;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .time-display {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 4px 0 8px;
      color: #111;
      line-height: 1;
    }

    .status {
      color: #666;
      font-size: 12px;
      min-height: 18px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      border: none;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
      min-height: 40px;
    }

    button:hover {
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .start-btn {
      background: #111;
      color: white;
    }

    .stop-btn {
      background: #e9e9ec;
      color: #111;
    }

    .refresh-btn {
      background: #f4f4f5;
      color: #444;
    }

    .message {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
      min-height: 16px;
    }

    .history-header {
      margin-bottom: 8px;
    }

    .history-subtitle {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    .session-log {
      background: #fafafa;
      padding: 10px 12px;
      border-radius: 14px;
      max-height: 220px;
      overflow-y: auto;
    }

    .empty-state {
      font-size: 12px;
      color: #888;
      padding: 4px 0;
    }

    .session-item {
      padding: 8px 0;
      border-bottom: 1px solid #ececec;
      font-size: 12px;
      color: #333;
      line-height: 1.45;
    }

    .session-item:last-child {
      border-bottom: none;
    }

    .session-duration {
      display: inline-block;
      margin-top: 3px;
      font-weight: 700;
      color: #111;
    }

    .compact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .compact-pill {
      background: #fff;
      border: 1px solid #ececec;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      color: #555;
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 12px;
        border-radius: 14px;
      }

      .top-grid {
        grid-template-columns: 1fr;
      }

      .profile-grid {
        grid-template-columns: 1fr 1fr;
      }

      .time-display {
        font-size: 38px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .session-log {
        max-height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Work Timer</h1>
      <div class="subtext">Compact shared timer for larua and margo.</div>

      <div class="top-grid">
        <div>
          <div class="section-title">Choose profile</div>
          <div class="profile-grid">
            <button class="profile-btn active" data-profile="larua">
              <div class="profile-name">larua</div>
              <div class="profile-meta">Track larua</div>
            </button>

            <button class="profile-btn" data-profile="margo">
              <div class="profile-name">margo</div>
              <div class="profile-meta">Track margo</div>
            </button>
          </div>
        </div>

        <div class="summary-box">
          <div class="section-title">This month</div>

          <div class="summary-item">
            <div class="summary-label">Profile</div>
            <div class="summary-value" id="selectedProfileLabel">larua</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Worked</div>
            <div class="summary-value" id="monthlyTotal">00:00:00</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">Sessions</div>
            <div class="summary-value" id="monthlySessions">0</div>
          </div>
        </div>
      </div>

      <div class="card timer-card">
        <div class="active-user" id="activeUserBadge">Active profile: larua</div>
        <div class="time-display" id="timer">00:00:00</div>
        <div class="status" id="status">Ready to start a session for larua.</div>

        <div class="buttons">
          <button class="start-btn" id="startBtn">Start</button>
          <button class="stop-btn" id="stopBtn" disabled>Stop</button>
          <button class="refresh-btn" id="refreshBtn">Refresh</button>
        </div>

        <div class="message" id="message"></div>
      </div>

      <div class="card">
        <div class="history-header">
          <div class="section-title">Session history</div>
          <div class="history-subtitle" id="historySubtitle">Showing saved sessions for larua</div>
        </div>

        <div class="session-log" id="logList"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "sharedWorkTimerActiveState";
    const PROFILES = ["larua", "margo"];

    let selectedProfile = "larua";
    let sessions = [];
    let timerInterval = null;

    const timerDisplay = document.getElementById("timer");
    const statusDisplay = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logList = document.getElementById("logList");
    const selectedProfileLabel = document.getElementById("selectedProfileLabel");
    const monthlyTotal = document.getElementById("monthlyTotal");
    const monthlySessions = document.getElementById("monthlySessions");
    const activeUserBadge = document.getElementById("activeUserBadge");
    const historySubtitle = document.getElementById("historySubtitle");
    const messageEl = document.getElementById("message");
    const profileButtons = document.querySelectorAll(".profile-btn");

    function getActiveState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { profile: null, start: null };

      try {
        return JSON.parse(raw);
      } catch {
        return { profile: null, start: null };
      }
    }

    function setActiveState(profile, start) {
      if (!profile || !start) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile, start }));
    }

    function formatDuration(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function formatDateTime(dateString) {
      return new Date(dateString).toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getMonthSessions(profileName) {
      const now = new Date();

      return sessions.filter((session) => {
        const d = new Date(session.start);
        return (
          session.profile === profileName &&
          d.getMonth() === now.getMonth() &&
          d.getFullYear() === now.getFullYear()
        );
      });
    }

    function getMonthTotalMs(profileName) {
      return getMonthSessions(profileName).reduce((sum, session) => sum + session.durationMs, 0);
    }

    function updateProfileButtons() {
      profileButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.profile === selectedProfile);
      });
    }

    function renderSummary() {
      selectedProfileLabel.textContent = selectedProfile;
      activeUserBadge.textContent = `Active profile: ${selectedProfile}`;
      historySubtitle.textContent = `Showing saved sessions for ${selectedProfile}`;
      monthlyTotal.textContent = formatDuration(getMonthTotalMs(selectedProfile));
      monthlySessions.textContent = String(getMonthSessions(selectedProfile).length);
    }

    function renderSessions() {
      const selectedSessions = sessions.filter((session) => session.profile === selectedProfile);
      logList.innerHTML = "";

      if (!selectedSessions.length) {
        logList.innerHTML = `<div class="empty-state">No sessions saved yet for ${selectedProfile}.</div>`;
        return;
      }

      selectedSessions.forEach((session) => {
        const item = document.createElement("div");
        item.className = "session-item";
        item.innerHTML = `
          <div><strong>${session.profile}</strong></div>
          <div>${formatDateTime(session.start)} → ${formatDateTime(session.end)}</div>
          <div class="session-duration">${formatDuration(session.durationMs)}</div>
        `;
        logList.appendChild(item);
      });
    }

    function updateTimerDisplay() {
      const active = getActiveState();

      if (!active.profile || !active.start || active.profile !== selectedProfile) {
        timerDisplay.textContent = "00:00:00";
        return;
      }

      const elapsed = Date.now() - new Date(active.start).getTime();
      timerDisplay.textContent = formatDuration(elapsed);
    }

    function updateControls() {
      const active = getActiveState();

      if (active.profile === selectedProfile && active.start) {
        statusDisplay.textContent = `Running for ${selectedProfile} since ${formatDateTime(active.start)}`;
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } else if (active.profile && active.profile !== selectedProfile) {
        statusDisplay.textContent = `${active.profile} currently has an active session on this device.`;
        startBtn.disabled = true;
        stopBtn.disabled = true;
      } else {
        statusDisplay.textContent = `Ready to start a session for ${selectedProfile}.`;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    function refreshUI() {
      updateProfileButtons();
      renderSummary();
      renderSessions();
      updateTimerDisplay();
      updateControls();
    }

    function setMessage(text) {
      messageEl.textContent = text || "";
    }

    async function fetchSessionsFromNotion() {
      const response = await fetch("/api/sessions");
      if (!response.ok) {
        throw new Error("Could not load sessions from Notion");
      }

      const data = await response.json();
      sessions = data.sessions || [];
      refreshUI();
    }

    function selectProfile(profileName) {
      selectedProfile = profileName;
      refreshUI();
    }

    function startSession() {
      const active = getActiveState();

      if (active.profile && active.profile !== selectedProfile) {
        alert(`${active.profile} already has a running session on this device.`);
        return;
      }

      setActiveState(selectedProfile, new Date().toISOString());
      refreshUI();
    }

    async function stopSession() {
      const active = getActiveState();

      if (active.profile !== selectedProfile || !active.start) return;

      const payload = {
        profile: selectedProfile,
        start: active.start,
        end: new Date().toISOString()
      };

      setMessage("Saving...");

      try {
        const response = await fetch("/api/save-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "Failed to save session");
        }

        setActiveState(null, null);
        await fetchSessionsFromNotion();
        setMessage("Saved.");
      } catch (error) {
        setMessage(error.message || "Failed to save session.");
      } finally {
        refreshUI();
      }
    }

    profileButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectProfile(btn.dataset.profile);
      });
    });

    startBtn.addEventListener("click", startSession);
    stopBtn.addEventListener("click", stopSession);

    refreshBtn.addEventListener("click", async () => {
      setMessage("Refreshing...");
      try {
        await fetchSessionsFromNotion();
        setMessage("Loaded latest sessions.");
      } catch (error) {
        setMessage(error.message || "Refresh failed.");
      }
    });

    timerInterval = setInterval(() => {
      updateTimerDisplay();
      updateControls();
    }, 1000);

    fetchSessionsFromNotion().catch(() => {
      refreshUI();
      setMessage("Could not load sessions yet.");
    });
  </script>
</body>
</html>
